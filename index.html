<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Mes Mémoires</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    width: 240px;
    height: 282px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---- Header ---- */
  #app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    flex-shrink: 0;
  }
  #app-header h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .add-btn {
    background: #238636;
    border: none;
    color: #fff;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---- Search ---- */
  #search-row {
    padding: 4px 10px;
    background: #0d1117;
    flex-shrink: 0;
  }
  #search-input {
    width: 100%;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid #30363d;
    background: #161b22;
    color: #e6edf3;
    font-size: 11px;
    outline: none;
  }
  #search-input::placeholder { color: #484f58; }

  /* ---- List ---- */
  #memo-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px;
    scrollbar-width: thin;
    scrollbar-color: #30363d transparent;
  }
  .memo-card {
    background: #161b22;
    border-radius: 8px;
    border: 1px solid #30363d;
    padding: 8px 10px;
    margin-bottom: 5px;
    cursor: pointer;
    position: relative;
  }
  .memo-card:active { background: #1c2128; }
  .memo-card .title {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .memo-card .preview {
    font-size: 10px;
    color: #8b949e;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .memo-card .date {
    font-size: 9px;
    color: #484f58;
    margin-top: 2px;
  }
  .memo-card .del-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    background: none;
    border: none;
    color: #484f58;
    font-size: 11px;
    cursor: pointer;
    padding: 2px 4px;
  }
  .memo-card .del-btn:active { color: #ef4444; }

  .empty-msg {
    text-align: center;
    color: #484f58;
    font-size: 11px;
    padding: 40px 10px;
    line-height: 1.5;
  }

  /* ---- Form overlay ---- */
  #form-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 50;
    align-items: flex-end;
  }
  #form-overlay.active { display: flex; }
  #form-card {
    background: #161b22;
    border-radius: 14px 14px 0 0;
    padding: 14px;
    width: 100%;
  }
  #form-card h2 {
    font-size: 13px;
    margin-bottom: 8px;
  }
  #form-card input, #form-card textarea {
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #30363d;
    background: #0d1117;
    color: #e6edf3;
    font-size: 12px;
    outline: none;
    font-family: inherit;
    margin-bottom: 6px;
  }
  #form-card textarea { height: 60px; resize: none; }
  .form-actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }
  .form-actions button {
    padding: 6px 14px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-cancel { background: #30363d; color: #e6edf3; }
  .btn-save { background: #238636; color: #fff; }

  /* ---- Detail modal ---- */
  #detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 50;
    align-items: flex-end;
  }
  #detail-overlay.active { display: flex; }
  #detail-card {
    background: #161b22;
    border-radius: 14px 14px 0 0;
    padding: 14px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  #detail-card .detail-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  #detail-card .detail-title {
    font-size: 15px;
    font-weight: 800;
  }
  #detail-card .detail-close {
    background: #30363d;
    border: none;
    color: #e6edf3;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  #detail-card .detail-date {
    font-size: 9px;
    color: #484f58;
    margin-bottom: 8px;
  }
  #detail-card .detail-body {
    font-size: 12px;
    line-height: 1.5;
    color: #c9d1d9;
    white-space: pre-wrap;
  }
  #detail-card .detail-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  #detail-card .detail-actions button {
    flex: 1;
    padding: 6px;
    border-radius: 8px;
    border: none;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-detail-back { background: #30363d; color: #e6edf3; }
  .btn-detail-delete { background: #3d1f28; color: #f85149; }
  .btn-detail-edit { background: #238636; color: #fff; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
</style>
</head>
<body>

<!-- Header -->
<div id="app-header">
  <h1>🧠 Mémoires</h1>
  <button class="add-btn" id="addBtn">+</button>
</div>

<!-- Search -->
<div id="search-row">
  <input type="text" id="search-input" placeholder="Rechercher...">
</div>

<!-- Memo List -->
<div id="memo-list">
  <div class="empty-msg" id="empty-msg">
    <p style="font-size:1.5rem;margin-bottom:6px">📝</p>
    <p>Aucune mémoire</p>
    <p>Appuie sur <strong>+</strong> pour commencer</p>
  </div>
</div>

<!-- Add/Edit Form -->
<div id="form-overlay">
  <div id="form-card">
    <h2 id="form-title">Nouvelle mémoire</h2>
    <input type="text" id="form-title-input" placeholder="Titre...">
    <textarea id="form-content-input" placeholder="Ton souvenir..."></textarea>
    <div class="form-actions">
      <button class="btn-cancel" id="form-cancel">Annuler</button>
      <button class="btn-save" id="form-save">💾</button>
    </div>
  </div>
</div>

<!-- Detail View -->
<div id="detail-overlay">
  <div id="detail-card">
    <div class="detail-header">
      <span class="detail-title" id="detail-title"></span>
      <button class="detail-close" id="detail-close">✕</button>
    </div>
    <div class="detail-date" id="detail-date"></div>
    <div class="detail-body" id="detail-body"></div>
    <div class="detail-actions">
      <button class="btn-detail-back" id="detail-back">Retour</button>
      <button class="btn-detail-edit" id="detail-edit">✎ Éditer</button>
      <button class="btn-detail-delete" id="detail-delete">🗑</button>
    </div>
  </div>
</div>

<script>
(function() {
  // === Storage ===
  const STORAGE_KEY = 'r1-memo-app-v1';

  function loadMemories() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }

  function saveMemories(memories) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(memories));
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
  }

  // === State ===
  let memories = loadMemories();
  let editingId = null; // null = new, 'xxx' = edit, 'delete' = view delete
  let viewingId = null;

  // === DOM refs ===
  const $list = document.getElementById('memo-list');
  const $empty = document.getElementById('empty-msg');
  const $formOverlay = document.getElementById('form-overlay');
  const $formTitle = document.getElementById('form-title');
  const $formTitleInput = document.getElementById('form-title-input');
  const $formContentInput = document.getElementById('form-content-input');
  const $formCancel = document.getElementById('form-cancel');
  const $formSave = document.getElementById('form-save');
  const $detailOverlay = document.getElementById('detail-overlay');
  const $detailTitle = document.getElementById('detail-title');
  const $detailDate = document.getElementById('detail-date');
  const $detailBody = document.getElementById('detail-body');
  const $detailClose = document.getElementById('detail-close');
  const $detailBack = document.getElementById('detail-back');
  const $detailEdit = document.getElementById('detail-edit');
  const $detailDelete = document.getElementById('detail-delete');
  const $searchInput = document.getElementById('search-input');

  // === Render ===
  function render() {
    const query = $searchInput.value.toLowerCase();
    const filtered = query
      ? memories.filter(m => m.title.toLowerCase().includes(query) || m.content.toLowerCase().includes(query))
      : memories;

    $list.innerHTML = '';

    if (memories.length === 0 && !query) {
      $list.appendChild($empty);
      $empty.style.display = 'block';
      return;
    }

    $empty.style.display = 'none';

    if (filtered.length === 0 && query) {
      const p = document.createElement('div');
      p.className = 'empty-msg';
      p.textContent = 'Aucun résultat pour « ' + query + ' »';
      $list.appendChild(p);
      return;
    }

    filtered.forEach(function(memo) {
      const card = document.createElement('div');
      card.className = 'memo-card';

      card.innerHTML = '<div class="title">' + esc(memo.title) + '</div>' +
        '<div class="preview">' + esc(memo.content.slice(0, 60)) + '</div>' +
        '<div class="date">' + formatDate(memo.createdAt) + '</div>' +
        '<button class="del-btn">✕</button>';

      card.querySelector('.title').addEventListener('click', function(e) { e.stopPropagation(); openDetail(memo.id); });
      card.querySelector('.preview').addEventListener('click', function(e) { e.stopPropagation(); openDetail(memo.id); });
      card.querySelector('.date').addEventListener('click', function(e) { e.stopPropagation(); openDetail(memo.id); });
      card.querySelector('.del-btn').addEventListener('click', function(e) { e.stopPropagation(); deleteMemory(memo.id); });
      card.addEventListener('click', function() { openDetail(memo.id); });

      $list.appendChild(card);
    });
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // === Actions ===
  function openAddForm() {
    editingId = null;
    $formTitle.textContent = 'Nouvelle mémoire';
    $formTitleInput.value = '';
    $formContentInput.value = '';
    $formOverlay.classList.add('active');
    $formTitleInput.focus();
  }

  function closeForm() {
    $formOverlay.classList.remove('active');
    editingId = null;
  }

  function saveForm() {
    var title = $formTitleInput.value.trim();
    var content = $formContentInput.value.trim();
    if (!title && !content) return;

    if (editingId) {
      // Edit existing
      memories = memories.map(function(m) {
        if (m.id === editingId) return { ...m, title: title || 'Sans titre', content: content };
        return m;
      });
    } else {
      memories.unshift({ id: generateId(), title: title || 'Sans titre', content: content, createdAt: Date.now() });
    }

    saveMemories(memories);
    closeForm();
    render();
  }

  function openDetail(id) {
    var memo = memories.find(function(m) { return m.id === id; });
    if (!memo) return;
    viewingId = id;
    $detailTitle.textContent = memo.title;
    $detailDate.textContent = new Date(memo.createdAt).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    $detailBody.textContent = memo.content;
    $detailOverlay.classList.add('active');
  }

  function closeDetail() {
    $detailOverlay.classList.remove('active');
    viewingId = null;
  }

  function deleteMemory(id) {
    memories = memories.filter(function(m) { return m.id !== id; });
    saveMemories(memories);
    if (viewingId === id) closeDetail();
    render();
  }

  function startEditFromDetail(id) {
    var memo = memories.find(function(m) { return m.id === id; });
    if (!memo) return;
    closeDetail();
    editingId = id;
    $formTitle.textContent = 'Modifier';
    $formTitleInput.value = memo.title;
    $formContentInput.value = memo.content;
    $formOverlay.classList.add('active');
  }

  // === Events ===
  document.getElementById('addBtn').addEventListener('click', openAddForm);
  $formCancel.addEventListener('click', closeForm);
  $formSave.addEventListener('click', saveForm);
  $detailClose.addEventListener('click', closeDetail);
  $detailBack.addEventListener('click', closeDetail);
  $detailEdit.addEventListener('click', function() { startEditFromDetail(viewingId); });
  $detailDelete.addEventListener('click', function() { deleteMemory(viewingId); });

  // Close overlays on overlay click
  $formOverlay.addEventListener('click', function(e) { if (e.target === $formOverlay) closeForm(); });
  $detailOverlay.addEventListener('click', function(e) { if (e.target === $detailOverlay) closeDetail(); });

  // === Init ===
  render();
})();
</script>
</body>
</html>
