<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
  <title>Mes Mémoires</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 240px;
      height: 282px;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    .header h1 { font-size: 13px; font-weight: 700; }
    .header .add-icon {
      width: 24px; height: 24px; border-radius: 6px;
      background: #2563eb; color: #fff; display: flex;
      align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
    }
    .content::-webkit-scrollbar { width: 2px; }
    .content::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

    .memo-item {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 4px;
      position: relative;
    }
    .memo-item.selected {
      border-color: #2563eb;
      background: rgba(37, 99, 235, 0.15);
    }
    .memo-item .memo-title {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .memo-item .memo-preview {
      font-size: 9px;
      color: #8b949e;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .memo-item .memo-date {
      font-size: 8px;
      color: #484f58;
      margin-top: 2px;
    }
    .memo-item .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: none;
      border: none;
      color: #484f58;
      font-size: 10px;
      cursor: pointer;
      padding: 2px;
    }
    .memo-item .delete-btn:active { color: #f85149; }

    .empty-msg {
      text-align: center;
      color: #484f58;
      font-size: 10px;
      padding: 40px 10px;
      line-height: 1.5;
    }

    /* ---- Detail overlay ---- */
    #detail-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      flex-direction: column;
    }
    #detail-overlay.active { display: flex; }
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }
    .detail-header h2 { font-size: 12px; font-weight: 700; }
    .detail-close {
      background: #30363d; border: none; color: #e6edf3;
      width: 22px; height: 22px; border-radius: 5px;
      font-size: 12px; cursor: pointer;
    }
    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-size: 10px;
      line-height: 1.5;
      color: #c9d1d9;
      white-space: pre-wrap;
    }
    .detail-date { font-size: 8px; color: #484f58; margin-bottom: 8px; }

    /* ---- Form overlay ---- */
    #form-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      flex-direction: column;
    }
    #form-overlay.active { display: flex; }
    .form-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }
    .form-header h2 { font-size: 12px; font-weight: 700; }
    .form-close {
      background: #30363d; border: none; color: #e6edf3;
      width: 22px; height: 22px; border-radius: 5px;
      font-size: 12px; cursor: pointer;
    }
    .form-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    .form-body input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 5px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 11px;
      font-family: inherit;
      margin-bottom: 6px;
      outline: none;
    }
    .form-body textarea {
      width: 100%;
      flex: 1;
      min-height: 100px;
      padding: 6px 8px;
      border-radius: 5px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 11px;
      font-family: inherit;
      resize: none;
      outline: none;
      margin-bottom: 6px;
    }
    .form-footer {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      background: #161b22;
      border-top: 1px solid #30363d;
    }
    .form-footer button {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel { background: #30363d; color: #e6edf3; }
    .btn-save { background: #2563eb; color: #fff; }

    .footer {
      padding: 3px 10px;
      background: #161b22;
      font-size: 8px;
      text-align: center;
      color: #484f58;
      border-top: 1px solid #30363d;
      flex-shrink: 0;
    }

    .voice-status {
      padding: 2px 8px;
      font-size: 8px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s;
      background: rgba(255,0,0,0.2);
    }
    .voice-status.listening { opacity: 1; }

    .nav-hint {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(37, 99, 235, 0.9);
      color: #fff;
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 9px;
      z-index: 200;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>🧠 Mémoires</h1>
  <div class="add-icon" id="addIcon">+</div>
</div>

<!-- Voice status -->
<div class="voice-status" id="voiceStatus">🎤 Écoute...</div>

<!-- Content -->
<div class="content" id="content">
  <div class="empty-msg" id="emptyMsg" style="display:none;">
    <p style="font-size:1.4rem;margin-bottom:6px;">📝</p>
    <p>Aucune mémoire</p>
    <p>Clic latéral pour créer</p>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  ⏎ Clic: créer · ↕ Molette: naviguer · 🎤 Appui long: dicter
</div>

<!-- Detail overlay -->
<div id="detail-overlay">
  <div class="detail-header">
    <h2 id="detail-title">Titre</h2>
    <button class="detail-close" id="detail-close">✕</button>
  </div>
  <div class="detail-body" id="detail-body">
    <div class="detail-date" id="detail-date"></div>
    <div id="detail-text"></div>
  </div>
</div>

<!-- Form overlay -->
<div id="form-overlay">
  <div class="form-header">
    <h2 id="form-title">Nouvelle mémoire</h2>
    <button class="form-close" id="form-close">✕</button>
  </div>
  <div class="form-body">
    <input type="text" id="form-input-title" placeholder="Titre...">
    <textarea id="form-input-content" placeholder="Ton souvenir..."></textarea>
  </div>
  <div class="form-footer">
    <button class="btn-cancel" id="form-cancel">Annuler</button>
    <button class="btn-save" id="form-save">💾 Enregistrer</button>
  </div>
</div>

<!-- Navigation hint -->
<div class="nav-hint" id="navHint">📌 Sélectionnée</div>

<script>
(function() {
  'use strict';

  // === R1 Bridges ===
  var useScroll = typeof window.scrollUp !== 'undefined' || window.addEventListener;
  var useSideBtn = typeof window.sideClick !== 'undefined' || window.addEventListener;
  var useVoice = typeof window.CreationVoiceHandler !== 'undefined';
  var useStorage = typeof window.creationStorage !== 'undefined' && window.creationStorage && window.creationStorage.plain;

  // === Storage ===
  var STORAGE_KEY = 'r1-memo-memories-v1';
  var memories = [];

  function loadMemories() {
    if (useStorage) {
      try {
        var raw = window.creationStorage.plain.getItem(STORAGE_KEY);
        if (raw) { memories = JSON.parse(atob(raw)); }
      } catch(e) { console.error('Load error:', e); }
    } else {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) { memories = JSON.parse(raw); }
      } catch(e) { memories = []; }
    }
  }

  function saveMemories() {
    var data = JSON.stringify(memories);
    if (useStorage) {
      try { window.creationStorage.plain.setItem(STORAGE_KEY, btoa(data)); }
      catch(e) { console.error('Save error:', e); }
    } else {
      try { localStorage.setItem(STORAGE_KEY, data); }
      catch(e) {}
    }
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function formatDate(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // === State ===
  loadMemories();
  var selectedIndex = -1;
  var viewingId = null;
  var editingId = null;
  var filteredMemories = [];

  // === DOM ===
  var $content = document.getElementById('content');
  var $emptyMsg = document.getElementById('emptyMsg');
  var $detailOverlay = document.getElementById('detail-overlay');
  var $detailTitle = document.getElementById('detail-title');
  var $detailDate = document.getElementById('detail-date');
  var $detailText = document.getElementById('detail-text');
  var $detailClose = document.getElementById('detail-close');
  var $formOverlay = document.getElementById('form-overlay');
  var $formTitle = document.getElementById('form-title');
  var $formInputTitle = document.getElementById('form-input-title');
  var $formInputContent = document.getElementById('form-input-content');
  var $formClose = document.getElementById('form-close');
  var $formCancel = document.getElementById('form-cancel');
  var $formSave = document.getElementById('form-save');
  var $voiceStatus = document.getElementById('voiceStatus');
  var $navHint = document.getElementById('navHint');
  var $addIcon = document.getElementById('addIcon');

  // === Render ===
  function render() {
    $content.innerHTML = '';

    if (memories.length === 0) {
      $content.appendChild($emptyMsg);
      $emptyMsg.style.display = 'block';
      selectedIndex = -1;
      return;
    }

    $emptyMsg.style.display = 'none';
    filteredMemories = memories.slice(0, 10); // Max 10 in viewport

    filteredMemories.forEach(function(memo, i) {
      var item = document.createElement('div');
      item.className = 'memo-item' + (i === selectedIndex ? ' selected' : '');

      var titleEl = document.createElement('div');
      titleEl.className = 'memo-title';
      titleEl.textContent = memo.title;

      var previewEl = document.createElement('div');
      previewEl.className = 'memo-preview';
      previewEl.textContent = memo.content.length > 50 ? memo.content.slice(0, 50) + '...' : memo.content;

      var dateEl = document.createElement('div');
      dateEl.className = 'memo-date';
      dateEl.textContent = formatDate(memo.createdAt);

      var delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        deleteMemory(memo.id);
      });

      item.appendChild(titleEl);
      item.appendChild(previewEl);
      item.appendChild(dateEl);
      item.appendChild(delBtn);

      item.addEventListener('click', function() {
        openDetail(memo.id);
      });

      $content.appendChild(item);
    });

    // Scroll to selected
    if (selectedIndex >= 0 && selectedIndex < $content.children.length) {
      var item = $content.children[selectedIndex];
      if (item) {
        var rect = item.getBoundingClientRect();
        var contentRect = $content.getBoundingClientRect();
        if (rect.bottom > contentRect.bottom) {
          $content.scrollTop += (rect.bottom - contentRect.bottom) + 20;
        } else if (rect.top < contentRect.top) {
          $content.scrollTop -= (contentRect.top - rect.top) + 20;
        }
      }
    }
  }

  // === Detail ===
  function openDetail(id) {
    var memo = memories.find(function(m) { return m.id === id; });
    if (!memo) return;
    viewingId = id;
    $detailTitle.textContent = memo.title;
    $detailDate.textContent = formatDate(memo.createdAt);
    $detailText.textContent = memo.content;
    $detailOverlay.classList.add('active');
  }

  function closeDetail() {
    $detailOverlay.classList.remove('active');
    viewingId = null;
  }

  function deleteMemory(id) {
    if (!confirm('Supprimer cette mémoire ?')) return;
    memories = memories.filter(function(m) { return m.id !== id; });
    saveMemories();
    if (viewingId === id) closeDetail();
    selectedIndex = Math.min(selectedIndex, memories.length - 1);
    if (selectedIndex < 0) selectedIndex = 0;
    render();
  }

  // === Form ===
  function openForm(editId) {
    editingId = editId || null;
    if (editingId) {
      var memo = memories.find(function(m) { return m.id === editingId; });
      if (!memo) return;
      $formTitle.textContent = 'Modifier';
      $formInputTitle.value = memo.title;
      $formInputContent.value = memo.content;
    } else {
      $formTitle.textContent = 'Nouvelle mémoire';
      $formInputTitle.value = '';
      $formInputContent.value = '';
    }
    $formOverlay.classList.add('active');
    $formInputTitle.focus();
  }

  function closeForm() {
    $formOverlay.classList.remove('active');
    editingId = null;
  }

  function saveForm() {
    var title = $formInputTitle.value.trim();
    var content = $formInputContent.value.trim();
    if (!title && !content) return;

    if (editingId) {
      memories = memories.map(function(m) {
        if (m.id === editingId) return { id: m.id, title: title || 'Sans titre', content: content, createdAt: m.createdAt };
        return m;
      });
    } else {
      memories.unshift({
        id: generateId(),
        title: title || 'Sans titre',
        content: content,
        createdAt: Date.now()
      });
    }

    saveMemories();
    closeForm();
    selectedIndex = Math.max(0, Math.min(selectedIndex, memories.length - 1));
    if (memories.length > 0 && selectedIndex < 0) selectedIndex = 0;
    render();
  }

  // === Navigation hint ===
  function showHint(text) {
    $navHint.textContent = text;
    $navHint.style.display = 'block';
    setTimeout(function() { $navHint.style.display = 'none'; }, 1500);
  }

  // === R1 Side button: create ===
  function handleSideClick() {
    closeDetail();
    closeForm();
    openForm();
  }

  // === R1 Scroll wheel: navigate list ===
  function handleScrollUp() {
    if (filteredMemories.length === 0) return;
    if (selectedIndex > 0) {
      selectedIndex--;
      render();
      showHint('↕ ' + (selectedIndex + 1) + '/' + filteredMemories.length);
    }
  }

  function handleScrollDown() {
    if (filteredMemories.length === 0) return;
    if (selectedIndex < filteredMemories.length - 1) {
      selectedIndex++;
      render();
      showHint('↕ ' + (selectedIndex + 1) + '/' + filteredMemories.length);
    }
  }

  // === R1 Voice: handle transcript ===
  function onSpeechReceived(transcript) {
    if (!transcript) return;
    // If form is open, fill content
    if ($formOverlay.classList.contains('active')) {
      $formInputContent.value = ($formInputContent.value + ' ' + transcript).trim();
    } else {
      // Create new memory with transcript as content
      memories.unshift({
        id: generateId(),
        title: transcript.split(' ').slice(0, 5).join(' ') + (transcript.split(' ').length > 5 ? '...' : ''),
        content: transcript,
        createdAt: Date.now()
      });
      saveMemories();
      selectedIndex = 0;
      render();
      showHint('🎤 Sauvegardé !');
    }
  }

  // === R1 Long press: voice recording ===
  var isRecording = false;

  function startRecording() {
    if (!useVoice) return;
    isRecording = true;
    $voiceStatus.classList.add('listening');
    try {
      if (window.CreationVoiceHandler && window.CreationVoiceHandler.postMessage) {
        window.CreationVoiceHandler.postMessage('start');
      }
    } catch(e) {}
  }

  function stopRecording() {
    if (!useVoice) return;
    isRecording = false;
    $voiceStatus.classList.remove('listening');
    try {
      if (window.CreationVoiceHandler && window.CreationVoiceHandler.postMessage) {
        window.CreationVoiceHandler.postMessage('stop');
      }
    } catch(e) {}
  }

  // === R1 Message handler ===
  window.onPluginMessage = function(data) {
    if (!data || !data.type) return;

    switch(data.type) {
      case 'sttEnded':
        if (data.transcript) {
          onSpeechReceived(data.transcript);
        }
        break;
      default:
        console.log('R1 Msg:', data);
    }
  };

  // === Attach R1 event listeners ===
  if (useScroll) {
    window.addEventListener('scrollUp', handleScrollUp);
    window.addEventListener('scrollDown', handleScrollDown);
  }

  if (useSideBtn) {
    window.addEventListener('sideClick', handleSideClick);
  }

  if (useVoice) {
    window.addEventListener('longPressStart', startRecording);
    window.addEventListener('longPressEnd', stopRecording);
  }

  // === Attach HTML event listeners (backup + detail/form) ===
  $addIcon.addEventListener('click', function() { closeDetail(); closeForm(); openForm(); });
  $detailClose.addEventListener('click', closeDetail);
  $formClose.addEventListener('click', closeForm);
  $formCancel.addEventListener('click', closeForm);
  $formSave.addEventListener('click', saveForm);

  $formOverlay.addEventListener('click', function(e) { if (e.target === $formOverlay) closeForm(); });
  $detailOverlay.addEventListener('click', function(e) { if (e.target === $detailOverlay) closeDetail(); });

  // === Init ===
  render();
})();
</script>
</body>
</html>
