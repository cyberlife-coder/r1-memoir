<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, height=282, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Installer Mémoire</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 240px; height: 282px; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 { font-size: 14px; margin-bottom: 6px; color: #fff; text-align: center; }
    p { font-size: 9px; color: #94a3b8; text-align: center; margin-bottom: 12px; }
    #qrcode {
      background: #fff;
      padding: 8px;
      border-radius: 8px;
    }
    .app-info {
      margin-top: 12px;
      font-size: 8px;
      color: #2563eb;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Installer</h1>
  <p>Scanne le QR code sur ton R1</p>
  <div id="qrcode"></div>
  <div class="app-info">Mémoire v1.0</div>

  <script>
    const config = {
      title: "Mémoire",
      url: "https://wiscale.github.io/r1-memoir/",
      description: "Journal personnel pour stocker et relire des mémoires avec navigation molette",
      themeColor: "#2563eb"
    };

    const payload = JSON.stringify(config);
    const qrUrl = `https://rabbit.tech/create-creation?payload=${encodeURIComponent(payload)}&v=${Date.now()}`;

    if (typeof QRCode !== 'undefined') {
      QRCode.toDataURL(qrUrl, {
        width: 180,
        margin: 1
      }, function (error) {
        if (error) console.error(error);
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        const img = document.createElement('img');
        img.src = qrUrl;
        // Use simple URL-based QR generation instead
        const qrImg = document.createElement('img');
        qrImg.src = qrUrl.replace(/https?:\/\/[^/]+/, '').substring(0, 0);
        // Actually, let's use the QRCode library properly
        QRCode.toDataURL(qrUrl, {
          width: 180,
          margin: 2,
          color: {
            dark: "#0f172a",
            light: "#ffffff"
          }
        }, function (err, url) {
          if (err) console.error(err);
          const qrContainer = document.getElementById('qrcode');
          qrContainer.innerHTML = '';
          const img = document.createElement('img');
          img.src = url;
          qrContainer.appendChild(img);
        });
      });
    }
  </script>
</body>
</html>
