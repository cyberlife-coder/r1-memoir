<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Installe Mes Mémoires sur ton R1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e0e10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 320px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 6px;
    }
    p {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    #qrcode {
      display: inline-block;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      margin: 10px 0;
    }
    #qrcode img {
      display: block;
    }
    .steps {
      text-align: left;
      margin-top: 20px;
      font-size: 11px;
      line-height: 1.8;
    }
    .steps span {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      width: 18px;
      height: 18px;
      line-height: 18px;
      text-align: center;
      border-radius: 50%;
      margin-right: 8px;
      font-size: 10px;
      font-weight: 600;
    }
    .update-note {
      margin-top: 16px;
      font-size: 10px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mes Mémoires</h1>
    <p>Journal personnel pour stocker tes souvenirs</p>

    <div id="qrcode"></div>

    <div class="steps">
      <div><span>1</span> Ouvre l'app <strong>Creations</strong> sur ton R1</div>
      <div><span>2</span> Appuie sur <strong>"Add via QR code"</strong></div>
      <div><span>3</span> Scanne le QR code ci-dessus</div>
      <div><span>4</span> L'app s'installe automatiquement dans ta stack</div>
    </div>

    <div class="update-note">
      Pour mettre à jour : rescanne le QR code après chaque changement
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    (function generateQR() {
      var installPayload = {
        title: "Mes Mémoires",
        url: "https://cyberlife-coder.github.io/r1-memoir/",
        description: "Journal personnel pour stocker tes souvenirs",
        iconUrl: "",
        themeColor: "#2563eb"
      };

      var qrData = JSON.stringify(installPayload);

      new QRCode(document.getElementById("qrcode"), {
        text: qrData,
        width: 240,
        height: 240,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    })();
  </script>
</body>
</html>
